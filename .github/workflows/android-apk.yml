name: Build DUGHRY Android APK
# First staged home-screen batch: validate the current feature branch.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - home-first-batch-01
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.dughry --project-name dughry .

      - name: Get Flutter packages
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none lib test

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build installable debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUGHRY-debug-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
