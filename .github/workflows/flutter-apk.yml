name: Build DUGHRY Flutter APK

on:
  push:
    branches: [ "main", "prototype-wow-preview", "diagnostics/startup-crash", "diagnostics/flutter-shell-test" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Backup app files and regenerate clean Flutter project
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          rm -rf android ios web linux macos windows test
          flutter create --org com.dughry --project-name dughry --platforms=android .
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/main.dart.bak lib/main.dart
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-9.5.0-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          # Work around an Android Lint crash in image_picker_android during release builds.
          if [ -f android/build.gradle.kts ]; then
            printf '\nallprojects { tasks.configureEach { if (name.startsWith("lintVital")) { enabled = false } } }\n' >> android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            printf '\nallprojects { tasks.configureEach { if (name.startsWith("lintVital")) { enabled = false } } }\n' >> android/build.gradle
          fi
          # Keep the preview installable beside the existing DUGHRY app.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/com\.dughry\.dughry/com.dughry.dughry.diagnostic/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/com\.dughry\.dughry/com.dughry.dughry.preview/g' android/app/build.gradle
          fi
          sed -i 's/android:label="dughry"/android:label="DUGHRY تشخيص"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Record Android startup configuration
        run: |
          echo "=== Flutter version ==="
          flutter --version
          echo "=== Generated Android manifest ==="
          cat android/app/src/main/AndroidManifest.xml
          echo "=== Generated Android Gradle config ==="
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle

      - name: Format Dart sources
        run: dart format lib

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DUGHRY-flutter-shell-test-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
